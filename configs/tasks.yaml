seed: 42
bootstrap_samples: 1000
t1_bli:
  metrics: [P@1, P@5]
  directions: [hi-en, en-hi]
  cv_folds: 5            # S24: cross-validated frequent band over the MUSE train words
t2_parallel:
  metrics: [Acc@1, MRR, Recall@5]
  directions: [hi-en, en-hi]
t3_xquad:
  metrics: [Recall@1, Recall@5, MRR]
  settings: [hi-en, hi-hi, en-hi, en-en]   # query lang - paragraph lang
t3b_miracl:                                # optional, S33 only
  metrics: [MRR@10, Recall@10]
  settings: [hi-hi]
  pools:
    max_random_passages: 20000   # random Hindi passages added to all judged-relevant ones
    seed: 42
